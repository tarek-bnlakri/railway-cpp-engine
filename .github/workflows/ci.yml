name: C++ Engine CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install gRPC and Protobuf Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ protobuf-compiler-grpc libgrpc++-dev protobuf-compiler libprotobuf-dev

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Compile C++ Code
      run: |
        cd build
        make -j$(nproc)

    - name: Run Automated Tests
      run: |
        cd build
        ./run_tests
